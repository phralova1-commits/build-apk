name: Build APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: true
      payload:
        required: true
      build_type:
        description: 'release or debug'
        required: true
        default: 'release'

concurrency:
  group: build-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Parse payload
        run: |
          echo '${{ github.event.inputs.payload }}' > payload.json
          ZIP_URL=$(jq -r '.zipAssetUrl' payload.json)
          if [ -z "$ZIP_URL" ]; then
            echo "::error::zipAssetUrl kosong"
            exit 1
          fi
          echo "ZIP_URL=$ZIP_URL" >> $GITHUB_ENV

      - name: Download ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -o project.zip "$ZIP_URL"
          ls -lh project.zip

      - name: Extract
        run: |
          mkdir -p project
          unzip -q project.zip -d project

      - name: Detect project
        id: detect
        run: |
          PUBSPEC=$(find project -type f -name pubspec.yaml -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -n 1)
          if [ -n "$PUBSPEC" ]; then
            DIR=$(dirname "$PUBSPEC")
            echo "type=flutter" >> $GITHUB_OUTPUT
            echo "dir=$DIR" >> $GITHUB_OUTPUT
          else
            echo "::error::pubspec.yaml tidak ditemukan"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Pub Get
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          flutter pub get || flutter pub upgrade || flutter pub upgrade --major-versions

      - name: Build APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          MODE="${{ github.event.inputs.build_type }}"
          if [ "$MODE" = "debug" ]; then
            flutter build apk --debug --target-platform android-arm64 2>&1 | tee build.log
          else
            flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons 2>&1 | tee build.log
          fi
          APK=$(find build -name '*.apk' 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan"
            tail -50 build.log
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
